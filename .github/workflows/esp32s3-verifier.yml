name: Publish ESP32-S3 verifier firmware

on:
  push:
    tags: ['esp32s3-verifier-v*']

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xiaoxiaoawei/hw_hub'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.3.2
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.firmware.outputs.commit }}
    steps:
      - name: Validate the dedicated firmware version tag
        id: version
        shell: bash
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['SOURCE_TAG']
          match = re.fullmatch(r'esp32s3-verifier-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))', tag)
          if not match:
              raise SystemExit('Expected esp32s3-verifier-vMAJOR.MINOR.PATCH')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\nversion=' + match[1] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          path: firmware-source
      - name: Build, test, merge and verify the immutable firmware source
        id: firmware
        shell: bash
        env:
          FIRMWARE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eo pipefail
          source /opt/esp/idf/export.sh
          set -u
          FIRMWARE_COMMIT=$(git -C firmware-source rev-parse HEAD)
          test "$FIRMWARE_COMMIT" = "$(git -C firmware-source rev-parse "refs/tags/$FIRMWARE_TAG^{commit}")"
          bash firmware-source/firmware/ble-verifier/scripts/build.sh \
            "$RUNNER_TEMP/ble-verifier-build" "$RUNNER_TEMP/ble-verifier-export"
          python firmware-source/scripts/package-esp32s3-verifier.py \
            --repo "$GITHUB_WORKSPACE/firmware-source" \
            --manifest "$RUNNER_TEMP/ble-verifier-export/manifest.json" \
            --commit "$FIRMWARE_COMMIT" --tag "$FIRMWARE_TAG" --check
          python firmware-source/scripts/package-esp32s3-verifier.py \
            --repo "$GITHUB_WORKSPACE/firmware-source" \
            --manifest "$RUNNER_TEMP/ble-verifier-export/manifest.json" \
            --commit "$FIRMWARE_COMMIT" --tag "$FIRMWARE_TAG" --output-dir "$RUNNER_TEMP/firmware-release" --write
          echo "assets_dir=$RUNNER_TEMP/firmware-release" >> "$GITHUB_OUTPUT"
          echo "commit=$FIRMWARE_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}-verified
          path: |
            ${{ steps.firmware.outputs.assets_dir }}/ESP32-S3-Verifier-v${{ steps.version.outputs.version }}-firmware.zip
            ${{ steps.firmware.outputs.assets_dir }}/ESP32-S3-Verifier-v${{ steps.version.outputs.version }}-source.zip
            ${{ steps.firmware.outputs.assets_dir }}/SHA256SUMS
            ${{ steps.firmware.outputs.assets_dir }}/release-plan.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.tag }}-verified
          path: ${{ runner.temp }}/firmware-release
      - name: Create or resume the exact draft, verify assets, publish without Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSETS_DIR: ${{ runner.temp }}/firmware-release
          FIRMWARE_TAG: ${{ needs.build.outputs.tag }}
          FIRMWARE_VERSION: ${{ needs.build.outputs.version }}
          FIRMWARE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          from urllib.parse import urlencode
          import zipfile

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def api(endpoint, *arguments, raw=False, missing_ok=False):
              result = subprocess.run(['gh', 'api', endpoint, *arguments], capture_output=True, timeout=90)
              if result.returncode:
                  status = re.search(rb'HTTP (\d+)', result.stderr)
                  if missing_ok and status and status[1] == b'404':
                      return None
                  raise RuntimeError('GitHub API request failed (HTTP ' + (status[1].decode() if status else 'unknown') + ')')
              return result.stdout if raw else json.loads(result.stdout)

          repo = os.environ['GH_REPO']
          require(repo == 'xiaoxiaoawei/hw_hub', 'Unexpected repository')
          tag = os.environ['FIRMWARE_TAG']
          version = os.environ['FIRMWARE_VERSION']
          commit = os.environ['FIRMWARE_COMMIT']
          require(re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version) and tag == 'esp32s3-verifier-v' + version, 'Invalid firmware version tag')
          require(re.fullmatch(r'[0-9a-f]{40,64}', commit), 'Invalid source commit')
          prefix = 'repos/' + repo
          directory = Path(os.environ['ASSETS_DIR'])
          stem = 'ESP32-S3-Verifier-v' + version
          names = {stem + '-firmware.zip', stem + '-source.zip', 'SHA256SUMS'}

          def verify_tag():
              obj = api(f'{prefix}/git/ref/tags/{tag}')['object']
              for _ in range(8):
                  if obj['type'] == 'commit':
                      require(obj['sha'] == commit, 'Approved firmware tag commit changed')
                      return
                  require(obj['type'] == 'tag', 'Unexpected tag object')
                  obj = api(f"{prefix}/git/tags/{obj['sha']}")['object']
              raise ValueError('Could not resolve immutable firmware tag')

          def validate_release(release, draft):
              require(release.get('id') == release_id and release.get('tag_name') == tag, 'Release identity mismatch')
              target = release.get('target_commitish')
              require(isinstance(target, str) and target, 'Missing release source metadata')
              if re.fullmatch(r'[0-9a-fA-F]{40,64}', target):
                  require(target.lower() == commit, 'Release source commit mismatch')
              require(release.get('name') == 'ESP32-S3 BLE Verifier v' + version, 'Release title mismatch')
              require(release.get('draft') is draft and release.get('prerelease') is False, 'Unexpected release state; published releases are never changed')

          def find_release():
              release = api(f'{prefix}/releases/tags/{tag}', missing_ok=True)
              if release is not None:
                  return release
              pages = api(f'{prefix}/releases?per_page=100', '--paginate', '--slurp')
              matches = [item for page in pages for item in page if item.get('tag_name') == tag]
              require(len(matches) <= 1, 'Multiple releases use this firmware tag')
              return api(f"{prefix}/releases/{matches[0]['id']}") if matches else None

          def verify_zip(data):
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  metadata = json.loads(archive.read('BUILD-METADATA.json'))
                  require(archive.testzip() is None and metadata.get('source_commit') == commit and metadata.get('target') == 'esp32s3' and metadata.get('firmware_version') == version, 'Firmware ZIP metadata/CRC mismatch')

          def verify_published(release):
              # Rebuilt images may contain different timestamps. Validate the
              # immutable published set against its own sums, never replace it.
              assets = release.get('assets', [])
              require(len(assets) == 3 and {asset['name'] for asset in assets} == names, 'Published firmware asset set differs')
              payloads = {}
              for asset in assets:
                  require(asset.get('state') == 'uploaded' and 0 < asset.get('size', 0) <= 64 * 1024 * 1024, 'Published asset state/size is invalid')
                  data = api(f"{prefix}/releases/assets/{asset['id']}", '--header', 'Accept: application/octet-stream', raw=True)
                  require(len(data) == asset['size'], 'Published asset size mismatch')
                  digest = asset.get('digest') or ''
                  if re.fullmatch(r'sha256:[0-9a-fA-F]{64}', digest):
                      require(hashlib.sha256(data).hexdigest() == digest.split(':', 1)[1].lower(), 'Published asset digest mismatch')
                  payloads[asset['name']] = data
              hashes = {}
              for line in payloads['SHA256SUMS'].decode('utf-8-sig').splitlines():
                  match = re.fullmatch(r'([0-9a-fA-F]{64})  (.+)', line)
                  require(match is not None and match[2] not in hashes, 'Published checksum file is invalid')
                  hashes[match[2]] = match[1].lower()
              require(set(hashes) == names - {'SHA256SUMS'}, 'Published checksum names differ')
              for name, digest in hashes.items():
                  require(hashlib.sha256(payloads[name]).hexdigest() == digest, 'Published checksum mismatch')
                  verify_zip(payloads[name])

          def application_latest():
              latest = api(f'{prefix}/releases/latest')
              require(not latest.get('draft') and not latest.get('prerelease') and re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', latest.get('tag_name', '')), 'Latest must remain a stable application release')
              return latest['tag_name']

          def verify_assets(release, complete):
              assets = release.get('assets', [])
              actual = {asset['name']: asset for asset in assets}
              require(len(actual) == len(assets) and set(actual).issubset(names), 'Unexpected or duplicate draft asset')
              if complete:
                  require(set(actual) == names, 'Release assets are incomplete')
              for name, asset in actual.items():
                  require(asset.get('state') == 'uploaded' and asset.get('size') == expected[name]['bytes'], 'Existing asset size/state differs; nothing overwritten')
                  digest = asset.get('digest') or ''
                  if re.fullmatch(r'sha256:[0-9a-fA-F]{64}', digest):
                      digest = digest.split(':', 1)[1].lower()
                  else:
                      data = api(f"{prefix}/releases/assets/{asset['id']}", '--header', 'Accept: application/octet-stream', raw=True)
                      digest = hashlib.sha256(data).hexdigest()
                  require(digest == expected[name]['sha256'], 'Existing asset digest differs; nothing overwritten')
              return actual

          try:
              plan = json.loads((directory / 'release-plan.json').read_text())
              require(plan.get('tag') == tag and plan.get('source_commit') == commit and plan.get('make_latest') is False and plan.get('publication_ready') is True, 'Build plan is not the approved source')
              expected = plan['assets']
              require(set(expected) == names, 'Unexpected firmware build assets')
              for name in names:
                  path = directory / name
                  require(path.is_file() and not path.is_symlink(), 'Missing verified build asset')
                  data = path.read_bytes()
                  require(len(data) == expected[name]['bytes'] and hashlib.sha256(data).hexdigest() == expected[name]['sha256'], 'Build artifact size/digest mismatch')
                  if name.endswith('.zip'):
                      verify_zip(data)
              verify_tag()
              application_latest()
              release = find_release()
              if release is None:
                  with tempfile.TemporaryDirectory() as temporary:
                      request = Path(temporary) / 'create.json'
                      request.write_text(json.dumps({'tag_name': tag, 'target_commitish': commit, 'name': 'ESP32-S3 BLE Verifier v' + version, 'draft': True, 'prerelease': False, 'make_latest': 'false', 'body': 'ESP-IDF 5.3.2 firmware built and verified from the immutable tag. Sources, flash manifest and checksums are included. Real-board validation is separate.'}))
                      release = api(f'{prefix}/releases', '--method', 'POST', '--input', str(request))
              release_id = release.get('id')
              require(isinstance(release_id, int) and release_id > 0, 'Missing release identity')
              endpoint = f'{prefix}/releases/{release_id}'
              if release.get('draft') is False:
                  validate_release(release, False)
                  verify_published(release)
                  verify_tag()
                  print('Verified existing published firmware ' + tag + '; application Latest remains ' + application_latest())
                  raise SystemExit(0)
              validate_release(release, True)
              existing = verify_assets(release, False)
              for name in sorted(names - set(existing)):
                  validate_release(api(endpoint), True)
                  upload = f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?' + urlencode({'name': name})
                  api(upload, '--method', 'POST', '--header', 'Content-Type: application/octet-stream', '--header', f"Content-Length: {expected[name]['bytes']}", '--input', str(directory / name))
              release = api(endpoint)
              validate_release(release, True)
              verify_assets(release, True)
              verify_tag()
              with tempfile.TemporaryDirectory() as temporary:
                  request = Path(temporary) / 'publish.json'
                  request.write_text(json.dumps({'draft': False, 'make_latest': 'false'}))
                  api(endpoint, '--method', 'PATCH', '--input', str(request))
              release = api(endpoint)
              validate_release(release, False)
              verify_assets(release, True)
              print('Published verified firmware ' + tag + '; application Latest remains ' + application_latest())
          except Exception as error:
              message = str(error).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Firmware publication failed::' + message)
              raise SystemExit(1)
          PY
