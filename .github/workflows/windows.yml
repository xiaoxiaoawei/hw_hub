name: Windows build and release

on:
  push:
    branches: [Flash_tool]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag (required when publishing)
        type: string
        default: ''
      publish_release:
        description: Publish the selected existing tag after verifying all release assets
        type: boolean
        default: false
      bundle_drivers:
        description: Download and embed complete official drivers (download failures fail the build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 (${{ github.ref_name }})
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.selection.outputs.tag }}
      publish_release: ${{ steps.selection.outputs.publish }}
    steps:
      - name: Select and validate the requested ref
        id: selection
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          PUBLISH_REQUESTED: ${{ inputs.publish_release && 'true' || 'false' }}
        run: |
          $Tag = ''
          $Publish = 'false'
          $Ref = $env:SOURCE_REF
          if ($env:EVENT_NAME -eq 'push' -and $env:SOURCE_REF_TYPE -eq 'tag') {
            $Tag = $env:SOURCE_REF_NAME
            $Publish = 'true'
          } elseif ($env:REQUESTED_TAG) {
            $Tag = $env:REQUESTED_TAG
            $Publish = $env:PUBLISH_REQUESTED
          } elseif ($env:PUBLISH_REQUESTED -eq 'true') {
            throw 'Publishing requires an existing release_tag such as v0.3.0.'
          }
          if ($Tag) {
            if ($Tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH.'
            }
            $Ref = "refs/tags/$Tag"
          }
          "ref=$Ref" >> $env:GITHUB_OUTPUT
          "tag=$Tag" >> $env:GITHUB_OUTPUT
          "publish=$Publish" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.selection.outputs.ref }}
          fetch-depth: 0
          lfs: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Check release version and offline versioning tests
        id: version
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ steps.selection.outputs.tag }}
        run: |
          python scripts/bump-version.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_versioning.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Version = python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:EXPECTED_TAG -and $env:EXPECTED_TAG -cne "v$Version") {
            throw "Tag $env:EXPECTED_TAG does not match Cargo.toml v$Version."
          }
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Verify, build and package Windows x64
        shell: pwsh
        env:
          BUNDLE_DRIVERS: ${{ inputs.bundle_drivers && 'true' || 'false' }}
          EXPECTED_TAG: ${{ steps.selection.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $RequireDrivers = [version]$env:APP_VERSION -ge [version]'0.4.0'
          ./scripts/build-windows.ps1 -FetchDrivers:($env:BUNDLE_DRIVERS -eq 'true') -RequireDrivers:$RequireDrivers -ExpectedTag $env:EXPECTED_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FlashTool-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/FlashTool-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Summarize successful build
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "## FlashTool v$env:APP_VERSION · Windows build succeeded" >> $env:GITHUB_STEP_SUMMARY
          "The versioned Windows ZIP and SHA256SUMS are available in this run's artifacts." >> $env:GITHUB_STEP_SUMMARY
          "Build email notifications use GitHub account Settings → Notifications → System → Actions → Email. Include successful workflows by disabling 'Only notify for failed workflows'." >> $env:GITHUB_STEP_SUMMARY

  release:
    if: needs.windows.outputs.publish_release == 'true'
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: publish-flashtool
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.windows.outputs.release_tag }}
          fetch-depth: 0
          lfs: false
          path: project
      - name: Check out the publisher from this workflow's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          lfs: false
          path: release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: FlashTool-v${{ needs.windows.outputs.version }}-windows-x64
          path: project/dist
      - name: Validate publisher ordering and failure behavior
        run: python -m unittest discover -s release-tools/tests -p test_publish_release.py -v
      - name: Verify plan, upload draft assets, then publish Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.windows.outputs.release_tag }}
        run: |
          set -euo pipefail
          bash release-tools/scripts/publish-release.sh --root project --assets-dir project/dist --tag "$RELEASE_TAG" --check
          bash release-tools/scripts/publish-release.sh --root project --assets-dir project/dist --tag "$RELEASE_TAG"
