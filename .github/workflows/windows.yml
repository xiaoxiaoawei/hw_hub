name: Windows build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bundle_drivers:
        description: Download and embed complete official drivers (download failures fail the build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Check release version and offline versioning tests
        id: version
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python scripts/bump-version.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_versioning.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Version = python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:EXPECTED_TAG -and $env:EXPECTED_TAG -cne "v$Version") {
            throw "Tag $env:EXPECTED_TAG does not match Cargo.toml v$Version."
          }
          "version=$Version" >> $env:GITHUB_OUTPUT
      - name: Verify, build and package Windows x64
        shell: pwsh
        env:
          BUNDLE_DRIVERS: ${{ inputs.bundle_drivers && 'true' || 'false' }}
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ./scripts/build-windows.ps1 -FetchDrivers:($env:BUNDLE_DRIVERS -eq 'true') -ExpectedTag $env:EXPECTED_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FlashTool-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/FlashTool-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: FlashTool-v${{ needs.windows.outputs.version }}-windows-x64
          path: release-assets
      - name: Publish release without replacing existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY' > release-notes.md
          import os, pathlib, re
          version = os.environ['VERSION']
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if not match:
              raise SystemExit('Missing release notes')
          print(match.group(1).strip())
          print('\n默认构建未内置 CH343 / CP210x 原厂驱动包；可在程序中手动选择官方 ZIP 安装。')
          print('\n本发布已通过 Windows 自动构建检查；USB Hub 多设备烧录与驱动安装仍需在实际硬件上验收。')
          PY
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if ! gh release create "$RELEASE_TAG" --verify-tag --title "FlashTool $RELEASE_TAG" --notes-file release-notes.md; then
              # A manual publication may have won the race. Never replace its files.
              gh release view "$RELEASE_TAG" >/dev/null
            fi
          fi
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for asset in release-assets/*; do
            name=$(basename "$asset")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              printf 'Keeping existing release asset: %s\n' "$name"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
