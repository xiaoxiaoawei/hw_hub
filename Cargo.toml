[package]
name = "esp32c3-flashtool"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Native ESP32 family batch flashing workstation"

[dependencies]
anyhow = "1"
espflash = { version = "=4.7.0", default-features = false, features = ["serialport"] }
serialport = { version = "4.7", default-features = false }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Environment", "Win32_System_Console", "Win32_System_Registry"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
panic = "unwind"
